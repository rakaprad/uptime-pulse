# Local demo stack: uptime-pulse + Prometheus + Grafana.
#   docker compose -f deploy/docker-compose.yml up -d --build
# Status page: http://localhost:8080  Prometheus: http://localhost:9090  Grafana: http://localhost:3000
name: uptime-pulse

services:
  uptime-pulse:
    build:
      context: ..
    image: ghcr.io/rakaprad/uptime-pulse:local
    command: ["-config", "/etc/uptime-pulse/config.yaml"]
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ./uptime-pulse.yaml:/etc/uptime-pulse/config.yaml:ro
    ports:
      - "8080:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - uptime-pulse
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
