version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - misspell
    - noctx
    - revive
    - unconvert
  settings:
    errcheck:
      # Closing a response body cannot meaningfully fail for our use.
      exclude-functions:
        - (io.ReadCloser).Close
    revive:
      rules:
        - name: exported
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
